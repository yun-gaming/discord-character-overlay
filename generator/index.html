<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Discord Character Overlay Generator</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ================================================================
         Header
    ================================================================= -->

    <header>

        <h1>Discord Character Overlay Generator</h1>

    </header>


    <!-- ================================================================
         Main
    ================================================================= -->

    <main class="container">


        <!-- Game -->

        <section class="panel">

            <label for="gameSelect">

                ゲーム

            </label>

            <select id="gameSelect">

                <option value="">

                    読み込み中...

                </option>

            </select>

        </section>


        <!-- Discord User ID -->

        <section class="panel">

            <label for="discordId">

                Discord User ID

            </label>

            <input
                id="discordId"
                type="text"
                placeholder="123456789012345678"
                autocomplete="off">

        </section>


        <!-- Character -->

        <section class="panel">

            <label for="characterSelect">

                キャラクター

            </label>

            <select id="characterSelect">

                <option value="">

                    キャラクターを選択してください

                </option>

            </select>

        </section>


        <!-- Preview -->

        <section class="preview">

            <img
                id="preview"
                src=""
                alt="キャラクタープレビュー">

            <p id="previewName"></p>

        </section>


        <!-- Add Player -->

        <section class="actions">

            <button
                id="addPlayer"
                type="button">

                プレイヤー追加

            </button>

        </section>


        <hr>


        <!-- Player List -->

        <section>

            <h2>登録一覧</h2>

            <ul id="playerList"></ul>

        </section>


        <!-- Generate -->

        <section class="actions">

            <button
                id="generateCSS"
                type="button">

                CSSをコピー

            </button>

            <button
                id="downloadCSS"
                type="button">

                CSSをダウンロード

            </button>

        </section>


    </main>


    <!-- ================================================================
         Loading
    ================================================================= -->

    <div id="loading" hidden>

        <span id="loadingMessage">

            Loading...

        </span>

    </div>


    <!-- ================================================================
         JavaScript
    ================================================================= -->

    <script
        type="module"
        src="./js/app.js">
    </script>

</body>

</html>
